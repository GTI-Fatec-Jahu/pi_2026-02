<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperação de Senha - PokéAdmin</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

  <div class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
              <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle p-3 mb-3">
                <i class="bi bi-key fs-1"></i>
              </div>
              <h3 class="fw-bold mb-1">Recuperar Senha</h3>
              <p class="text-muted small">Informe seu e-mail para receber o link de recuperação</p>
            </div>

            <div id="alert-sucesso" class="alert alert-success d-none mb-3" role="alert">
              <i class="bi bi-check-circle-fill me-2"></i> E-mail de recuperação enviado com sucesso! Verifique sua caixa de entrada.
            </div>

            <form id="form-recuperar" onsubmit="event.preventDefault(); document.getElementById('alert-sucesso').classList.remove('d-none');">
              <div class="mb-4">
                <label for="recuperar-email" class="form-label fw-semibold">E-mail Cadastrado</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control bg-light border-start-0" id="recuperar-email" required placeholder="treinador@pokeadmin.com">
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                <i class="bi bi-send me-1"></i> Enviar Instruções
              </button>

              <div class="text-center">
                <a href="login.html" class="btn btn-link text-decoration-none text-muted">
                  <i class="bi bi-arrow-left me-1"></i> Voltar para o Login
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5.3 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
